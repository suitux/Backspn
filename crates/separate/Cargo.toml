[package]
name = "backspn-separate"
description = "Splits a track into drums, bass, other and vocals with an open separation model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sha2 = "0.10"
thiserror.workspace = true
backspn-analysis = { path = "../analysis" }
backspn-decode = { path = "../decode" }
ureq = "3"

# The runtime is a library shipped with the app (packaging/*/onnxruntime.sh)
# and loaded only when stems are generated, so the app starts on any processor
# and system even where the runtime can't run.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-23"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = "0.3.2"

[lints]
workspace = true
