[package]
name = "backspn-control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
# On Linux, the backend that reads sysfs itself: the default one walks the
# device database through libudev, which libusb's hotplug thread also uses,
# and libudev aborts when two threads use it at once.
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev"] }
midir = "0.11.1"
rusb = { version = "0.9.4", features = ["vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
backspn-formats = { path = "../formats" }

[lints]
workspace = true
