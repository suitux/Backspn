[package]
name = "backspn-app"
default-run = "Backspn"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = "0.37.0"
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.34"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3"
uuid = { version = "1.28.0", features = ["v4"] }
backspn-analysis = { path = "../analysis" }
backspn-control = { path = "../control" }
backspn-decode = { path = "../decode" }
backspn-encode = { path = "../encode" }
backspn-engine = { path = "../engine" }
backspn-formats = { path = "../formats" }
backspn-library = { path = "../library" }
backspn-link = { path = "../link" }
backspn-separate = { path = "../separate" }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21.2"
objc2 = { version = "0.6.5", features = ["exception"] }
objc2-foundation = "0.3.2"

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[lints]
workspace = true

[[bin]]
name = "Backspn"
path = "src/main.rs"

[package.metadata.packager]
product-name = "Backspn"
identifier = "app.backspn.Backspn"
description = "DJ software"
category = "Music"
copyright = "Copyright (C) 2026 Xavier Rincón"
license-file = "../../LICENSE"
before-packaging-command = "cargo build --release -p backspn-app"
binaries = [{ path = "Backspn", main = true }]
out-dir = "../../target/packages"
binaries-dir = "../../target/release"
icons = ["icon/backspn-app.png", "icon/backspn.icns", "icon/backspn.ico"]
formats = ["app", "dmg", "nsis", "deb", "appimage"]

[package.metadata.packager.macos]
info-plist-path = "../../packaging/macos/Info.plist"

[package.metadata.packager.deb]
depends = ["libasound2"]
files = { "../../packaging/linux/99-backspn.rules" = "lib/udev/rules.d/99-backspn.rules" }
