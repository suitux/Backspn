name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${tag%%-*}"
          workspace=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$version" != "$workspace" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $workspace"
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            formats: app
            platform: apple
            arch: universal
          - os: windows-latest
            formats: nsis
            platform: windows
            arch: x86_64
          - os: ubuntu-24.04
            formats: deb,appimage
            platform: linux
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libclang-dev libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev \
            libfuse2t64
      - name: Intel target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Package
        working-directory: crates/app
        shell: bash
        run: |
          export BACKSPN_VERSION="${GITHUB_REF_NAME#v}"
          cargo packager --release --formats ${{ matrix.formats }}
      - name: Sign and make the disk image
        if: runner.os == 'macOS'
        run: |
          export BACKSPN_VERSION="${GITHUB_REF_NAME#v}"
          packaging/macos/universal.sh target/packages/Backspn.app
          brew install create-dmg
          codesign --force --deep --sign - target/packages/Backspn.app
          codesign --verify --deep --strict target/packages/Backspn.app
          packaging/macos/dmg/make-dmg.sh target/packages/Backspn.app target/packages/Backspn.dmg
          COPYFILE_DISABLE=1 tar -czf target/packages/Backspn.app.tar.gz -C target/packages Backspn.app
      - name: Name the packages
        working-directory: target/packages
        shell: bash
        run: |
          name="Backspn_${GITHUB_REF_NAME#v}_${{ matrix.platform }}_${{ matrix.arch }}"
          for f in *.dmg *.exe *.deb *.AppImage; do
            if [ -e "$f" ]; then mv "$f" "$name.${f##*.}"; fi
          done
          if [ -e Backspn.app.tar.gz ]; then mv Backspn.app.tar.gz "$name.app.tar.gz"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: backspn-${{ runner.os }}
          path: |
            target/packages/*.dmg
            target/packages/*.app.tar.gz
            target/packages/*.exe
            target/packages/*.deb
            target/packages/*.AppImage
          if-no-files-found: error

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Sign the update manifest
        env:
          UPDATE_KEY: ${{ secrets.BACKSPN_UPDATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaging/manifest.sh "$version" packages
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          key="$RUNNER_TEMP/update.key"
          printf '%s\n' "$UPDATE_KEY" > "$key"
          minisign -S -s "$key" -m packages/backspn-manifest.json -t "backspn-manifest $version"
          rm -f "$key"
          minisign -V -p crates/app/src/support/update/backspn.pub -m packages/backspn-manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          files: packages/*
