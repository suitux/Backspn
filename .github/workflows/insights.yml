name: Insights

on:
  push:
    branches: [main]
    paths: ['insights/**', '.github/workflows/insights.yml']
  pull_request:
    paths: ['insights/**', '.github/workflows/insights.yml']
  workflow_dispatch:

concurrency:
  group: insights-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: insights

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: insights/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # Migrations first: a new column must exist before the code that writes it goes live.
      - name: Apply D1 migrations
        if: github.event_name != 'pull_request'
        run: pnpm wrangler d1 migrations apply backspn-insights --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
